[project]
name = "workflow-plan"
version = "0.8.0"
description = "Keeps human-agent development semantically precise, so coherent domain type systems can be built without semantic drift"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.scripts]
workflow-plan = "workflow_plan.cli:main"
# ⚠️ Retired, and kept as an ERROR rather than removed. A vanished command reads as a broken venv —
# the old slash command had a whole fallback stanza for "the console script is often missing" — and
# a working alias would keep a second vocabulary alive. This one names its successor and exits 2.
conceptlint = "workflow_plan.cli:retired"

[project.optional-dependencies]
pydantic-graph = [
    "pydantic-graph>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_plan", "conceptlint"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
