[project]
name = "plan-types"
version = "0.4.0"
description = "Keeps human-agent development semantically precise, so coherent domain type systems can be built without semantic drift"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.scripts]
conceptlint = "conceptlint.core.lint:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plan_types", "conceptlint"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
