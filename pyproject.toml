[project]
name = "workflow-plan"
version = "0.7.0"
description = "Keeps human-agent development semantically precise, so coherent domain type systems can be built without semantic drift"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.scripts]
conceptlint = "conceptlint.core.lint:main"

[project.optional-dependencies]
pydantic-graph = [
    "pydantic-graph>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_plan", "conceptlint"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
